*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:"Noto Sans Ethiopic", sans-serif;
  background:#fbf8ef;
  color:#263b31;
  line-height:1.8;
}

a{
  text-decoration:none;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

/* HEADER */

  background:#073d2b;
  color:white;
}

.header-main{
  padding:18px 0;
}

.header-content{
  display:flex;
  align-items:center;
  gap:15px;
}

.logo{
  width:70px;
  height:70px;
  object-fit:contain;
  background:white;
  border-radius:50%;
  padding:4px;
}

.brand{
  flex:1;
}

.brand h1{
  margin:0;
  font-size:34px;
  font-weight:900;
  line-height:1.25;

  margin:5px 0 0;

}

.main-call{
  background:#c69a43;
  color:white;
  padding:10px 17px;
  border-radius:10px;
  font-weight:800;
  white-space:nowrap;
}

nav{
  background:#052f22;
}

.nav-content{
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
}

nav a{
  color:white;
  padding:10px 13px;
  font-size:14px;
  font-weight:700;
}

nav a:hover{
  background:#15543e;
  border-radius:8px;
}

.language{
  margin-left:auto;
}

.language select{
  border:0;
  border-radius:8px;
  padding:7px 9px;
  font-family:inherit;
}
