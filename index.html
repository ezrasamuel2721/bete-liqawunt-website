<html lang="am">

    }

    body {

        "Noto Sans Ethiopic",
        "Abyssinica SIL",
        "Nyala",
        Arial,

      background: #f7f3e8;
      color: #173b2b;
      line-height: 1.8;
    }

    a {
      text-decoration: none;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #173b2b, #0d2b21);
      color: white;
      padding: 28px 16px;
      border-bottom: 4px solid #d5a928;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      text-align: center;
    }

    .logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      display: block;
      margin: 0 auto 15px;
    }

    .brand {
      font-size: clamp(32px, 7vw, 54px);
      font-weight: 900;
      color: #f3cf58;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 900px;
      margin: 12px auto 0;
      font-size: clamp(16px, 3vw, 21px);
      font-weight: 600;
      color: #ffffff;
    }

    /* NAVIGATION */
    nav {
      background: #0b241b;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }

    .nav-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 14px;
    }

    nav a {
      color: white;
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
    }

    nav a:hover {
      background: #28543d;
    }

    .hero {
      background:
        linear-gradient(135deg, #fffdf7, #eee5cf);
      padding: 55px 16px;
      text-align: center;
    }

    .hero-inner {
      max-width: 950px;
      margin: auto;
    }

    .hero h1 {
      color: #173b2b;
      font-size: clamp(28px, 6vw, 46px);
      line-height: 1.45;
      margin-bottom: 15px;
      font-weight: 900;
    }

    .hero p {
      max-width: 760px;
      margin: auto;
      color: #4b5b52;
      font-size: clamp(17px, 3.5vw, 21px);
      font-weight: 500;
    }
