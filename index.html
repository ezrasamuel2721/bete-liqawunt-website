  color:#26352b;
  line-height:1.7;
}

header{

  position:sticky;
  top:0;
  z-index:10;
}

nav button{
  border:0;
  background:#0d5c3b;
  color:white;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}

nav button:hover{

.lang{

  margin-bottom:8px;
}

.hero p{
  font-size:18px;
}

.call{

  margin-top:18px;
  background:#d4af37;
  color:#173d2c;

  padding:12px 30px;
  border-radius:30px;
  font-weight:bold;
  font-size:20px;
}

.card{

  border-radius:14px;
  padding:22px;
  margin:18px 0;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.card h2{
  color:#0d5c3b;
  margin-bottom:12px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:5px;
  font-weight:bold;
}

  padding:12px;
  border:1px solid #c9c9c9;
  border-radius:8px;
  font-size:16px;
  font-family:inherit;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.submit{

  margin-top:16px;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#0d5c3b;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.submit:hover{
  background:#174f36;
}

.message{

  margin-top:14px;
  padding:12px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
}
