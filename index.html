:root{
  --gold:#9a7735;

  --cream:#fbf8f1;
  --white:#fff;
  --line:#e7ddca;
  --text:#40372d;
  --muted:#70675b;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;

  color:var(--text);
  font-family:Arial,"Noto Sans Ethiopic",sans-serif;
  line-height:1.7;
}

header{
  position:sticky;
  top:0;

  background:rgba(255,253,249,.94);

}

.nav{

}

.logo{
  text-decoration:none;
  color:var(--dark);

  font-weight:900;
}

.logo span{

  font-size:9px;
  letter-spacing:3px;
}

nav{
  display:flex;
  gap:5px;
}

nav a{
  text-decoration:none;
  color:var(--text);
  font-size:14px;
  font-weight:800;
  padding:9px 11px;
  border-radius:10px;
}

nav a:hover{
  background:var(--gold-light);
  color:var(--gold);
}

.lang{
  border:1px solid #d7c59e;

  font-weight:900;

}

.menu{

  font-size:20px;
}

.cross{

  place-items:center;
  border-radius:24px;

}

.badge{

  font-size:12px;
  font-weight:900;
}

.hero h1{
  font-size:clamp(40px,7vw,65px);
  line-height:1.15;
  margin:14px 0 8px;
  color:var(--dark);
}

.hero h2{
  font-size:clamp(16px,2.5vw,21px);
  color:#735a35;
  margin:0 0 15px;
}

.hero p{
  max-width:760px;
  margin:0 auto 28px;
  color:var(--muted);
}

.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:48px;
  padding:12px 21px;
  border-radius:13px;
  text-decoration:none;
  font-weight:900;
  cursor:pointer;
  border:1px solid transparent;
}

.primary{
  background:var(--gold);
  color:#fff;
  box-shadow:0 10px 24px rgba(120,85,30,.2);
}

.secondary{
  background:white;
  color:#765a29;
  border-color:#d7c59e;
}

.btn:hover{
  transform:translateY(-2px);
}

.quick{
  max-width:980px;
  margin:-25px auto 0;
  padding:0 18px;
  position:relative;
}

.quick-box{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:12px;
  box-shadow:0 15px 45px rgba(50,35,15,.08);
}

.quick-item{
  text-align:center;
  padding:14px;
  border-radius:13px;
}

.quick-item:hover{
  background:#fcfaf5;
}

.quick-item strong{
  display:block;
}

.quick-item span{
  color:var(--muted);
  font-size:13px;
}

.section{
  max-width:1150px;
  margin:auto;
  padding:78px 18px;
}

.section-head{

  max-width:750px;
  margin:0 auto 30px;
}

.kicker{

  font-size:12px;
  font-weight:900;
  letter-spacing:2px;
}
